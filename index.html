<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcMint Studios | Smart Rupee Support</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --surface-color: #1a1d2e;
            --primary-color: #3b82f6;
            --accent-color: #00d084;
            --text-main: #ffffff;
            --text-dim: #b0b3c1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
        }

        .logo-box {
            background-color: var(--surface-color);
            width: 320px; /* Increased size since it has the name */
            border-radius: 2rem;
            margin: 0 auto 3rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 1rem;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        p.tagline {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 4rem;
            opacity: 0.8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        .card {
            background-color: var(--surface-color);
            padding: 2rem 1.5rem;
            border-radius: 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-color);
            background-color: #23273a;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .card span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: normal;
            margin-top: 0.75rem;
            opacity: 0.7;
        }

        footer {
            margin-top: 5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            opacity: 0.5;
            line-height: 1.8;
        }

        a.contact {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        a.contact:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <img src="/assets/images/smart-rupee-logo.png" alt="Smart Rupee Logo">
        </div>

        <p class="tagline">Official Documentation & Support</p>

        <div class="grid">
            <a href="how-to-use/" class="card">
                User Guide
                <span>Setup & feature walkthrough</span>
            </a>
            <a href="how-to-use-hindi/" class="card">
                उपयोग कैसे करें
                <span>हिंदी भाषा में निर्देश</span>
            </a>
            <a href="privacy-policy/" class="card">
                Privacy Policy
                <span>Your data privacy is our priority</span>
            </a>
            <a href="terms-of-use/" class="card">
                Terms of Use
                <span>Legal terms of service</span>
            </a>
        </div>

        <footer>
            &copy; 2026 ArcMint Studios. All rights reserved.<br>
            For support: <a href="mailto:arcmintstudios@gmail.com" class="contact">arcmintstudios@gmail.com</a>
        </footer>
    </div>
</body>
</html>
